services:
  - type: web
    # Preview only: choose a production plan separately before going live.
    name: ontrack-2027-preview
    runtime: node
    plan: free
    rootDir: BACKEND
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        sync: false
      - key: ATLAS_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
